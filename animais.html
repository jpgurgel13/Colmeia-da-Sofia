<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animais.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="js/animais.js" defer></script>
    <title>Colmeia da Sofia</title>
  </head>
  <body>
    <h1>Colmeia da Sofia</h1>
    <main>
      <div class="container-animais">
        <button
          class="botao-animal"
          data-animal="cachorro"
          aria-label="cachorro"
        >
          <img src="assets/animais/cachorro.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="gato" aria-label="gato">
          <img src="assets/animais/gato.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="abelha" aria-label="abelha">
          <img src="assets/animais/abelha.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="macaco" aria-label="macaco">
          <img src="assets/animais/macaco.svg" alt="" />
        </button>
        <button
          class="botao-animal"
          data-animal="elefante"
          aria-label="elefante"
        >
          <img src="assets/animais/elefante.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="leao" aria-label="leão">
          <img src="assets/animais/leao.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="cavalo" aria-label="cavalo">
          <img src="assets/animais/cavalo.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="vaca" aria-label="vaca">
          <img src="assets/animais/vaca.svg" alt="" />
        </button>
        <button class="botao-animal" data-animal="galinha" aria-label="galinha">
          <img src="assets/animais/galinha.svg" alt="" />
        </button>
      </div>
      <p class="nome-animal"></p>
    </main>
  </body>
</html>
