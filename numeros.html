<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/numeros.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="js/numeros.js" defer></script>
    <title>Números</title>
  </head>
  <body>
    <header class="cabecalho">
      <a href="index.html" class="botao-voltar" aria-label="Voltar ao menu">
        <img src="assets/img/voltar.svg" alt="" />
      </a>
      <a href="index.html" class="logo">Colmeia da Sofia</a>
    </header>

    <h1>Números</h1>
    <main>
      <div class="container-numeros">
        <button class="botao-numero" data-numero="1" aria-label="um">
          <img src="assets/numeros/numero-1.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="2" aria-label="dois">
          <img src="assets/numeros/numero-2.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="3" aria-label="três">
          <img src="assets/numeros/numero-3.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="4" aria-label="quatro">
          <img src="assets/numeros/numero-4.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="5" aria-label="cinco">
          <img src="assets/numeros/numero-5.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="6" aria-label="seis">
          <img src="assets/numeros/numero-6.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="7" aria-label="sete">
          <img src="assets/numeros/numero-7.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="8" aria-label="oito">
          <img src="assets/numeros/numero-8.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="9" aria-label="nove">
          <img src="assets/numeros/numero-9.svg" alt="" />
        </button>
        <button class="botao-numero" data-numero="10" aria-label="dez">
          <img src="assets/numeros/numero-10.svg" alt="" />
        </button>
      </div>
      <p class="nome-numero"></p>
    </main>
  </body>
</html>
