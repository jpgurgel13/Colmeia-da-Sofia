<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/familia.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="js/familia.js" defer></script>
    <title>Família</title>
  </head>
  <body>
    <div class="container-familia">
    <header class="cabecalho">
      <a href="index.html" class="botao-voltar" aria-label="Voltar ao menu">
        <img src="assets/img/voltar.svg" alt="" />
      </a>
      <a href="index.html" class="logo">Colmeia da Sofia</a>
    </header>

    <h1>Família</h1>
    <main>
      <article class="cartao-pessoa">
        <button class="botao-familia" data-pessoa="papai" aria-label="Papai">
          <img src="assets/familia/papai.svg" alt="" />
        </button>
        <label
          for="foto-papai"
          class="botao-trocar-foto"
          aria-label="Trocar foto do papai"
        >
          <img src="assets/img/mais.svg" alt="" />
        </label>
        <input type="file" id="foto-papai" accept="image/*" hidden />
      </article>
      <article>
        <button class="botao-familia" data-pessoa="mamae" aria-label="Mamãe">
          <img src="assets/familia/mamae.svg" alt="" />
          </button>
          <label
            for="foto-mamae"
            class="botao-trocar-foto"
            aria-label="Trocar foto da mamãe"
          >
            <img src="assets/img/mais.svg" alt="" />
          </label>
          <input type="file" id="foto-mamae" accept="image/*" hidden />
        
      </article>
    </div>
      <p class="nome-familia"></p>
    </main>
  </body>
</html>
