<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="js/cores.js" defer></script>
    <title>Colmeia da Sofia</title>
  </head>
  <body>
    <header class="cabecalho">
      <a href="index.html" class="botao-voltar" aria-label="Voltar ao menu">
        <img src="assets/img/voltar.svg" alt="" />
      </a>
      <a href="index.html" class="logo">Colmeia da Sofia</a>
    </header>

    <h1>Cores</h1>
    <main>
      <div class="container-cores">
        <button
          class="botao-cor"
          data-cor="vermelho"
          aria-label="vermelho"
        ></button>

        <button class="botao-cor" data-cor="verde" aria-label="verde"></button>
        <button class="botao-cor" data-cor="azul" aria-label="azul"></button>

        <button
          class="botao-cor"
          data-cor="amarelo"
          aria-label="amarelo"
        ></button>
      </div>
      <p class="nome-cor"></p>
    </main>
  </body>
</html>
