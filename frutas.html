<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/frutas.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="js/frutas.js" defer></script>
    <title>Frutas</title>
  </head>
  <body>
    <header class="cabecalho">
      <a href="index.html" class="botao-voltar" aria-label="Voltar ao menu">
        <img src="assets/img/voltar.svg" alt="" />
      </a>
      <a href="index.html" class="logo">Colmeia da Sofia</a>
    </header>

    <h1>Frutas</h1>
    <main>
      <div class="container-frutas">
        <button class="botao-fruta" data-fruta="maca" aria-label="maçã">
          <img src="assets/frutas/maca.svg" alt="" />
        </button>
        <button class="botao-fruta" data-fruta="banana" aria-label="banana">
          <img src="assets/frutas/banana.svg" alt="" />
        </button>
        <button class="botao-fruta" data-fruta="pera" aria-label="pera">
          <img src="assets/frutas/pera.svg" alt="" />
        </button>
        <button class="botao-fruta" data-fruta="uva" aria-label="uva">
          <img src="assets/frutas/uva.svg" alt="" />
        </button>
        <button class="botao-fruta" data-fruta="melancia" aria-label="melancia">
          <img src="assets/frutas/melancia.svg" alt="" />
        </button>
        <button class="botao-fruta" data-fruta="abacaxi" aria-label="abacaxi">
          <img src="assets/frutas/abacaxi.svg" alt="" />
        </button>
        <button class="botao-fruta" data-fruta="limao" aria-label="limão">
          <img src="assets/frutas/limao.svg" alt="" />
        </button>
      </div>
      <p class="nome-fruta"></p>
    </main>
  </body>
</html>
